# Builds the Android APK on GitHub's servers every time you push to main
# (or when you press "Run workflow"). Download it from the run's "Artifacts" section.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: bash tool/setup_android.sh

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: arab-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
